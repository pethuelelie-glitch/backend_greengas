openapi: 3.0.3
info:
  title: GREENGAS API
  version: 1.6.1
  description: |
    Contrat d'API commun de GREENGAS (SIREXE Hackathon 2026, équipe DEDSEC).
    Ce fichier fait foi pour le backend Django, l'application Flutter et le Control Center (React / Electron).
    Toute modification passe par une pull request relue par les trois équipes (voir CONTRAT.md).

    Conventions clés :
    - Identifiants techniques en UUID ; codes lisibles (BAC-014, TRN-0912-01, ORG-0258, DIG-01) en plus.
    - Noms de champs en français, snake_case, sans accents.
    - Dates-heures en ISO 8601 UTC (`2026-09-12T08:30:00Z`) ; dates seules en `AAAA-MM-JJ`.
    - Nombres décimaux envoyés comme nombres JSON (jamais comme chaînes).
    - Pourcentages exprimés en points de pourcentage (20 = 20 %), champs suffixés `_pct`.
    - Toutes les URL se terminent par une barre oblique `/`.
servers:
  - url: http://localhost:8000/api/v1
    description: Backend Django local
  - url: http://localhost:4010
    description: Serveur de maquette Prism (voir CONTRAT.md)
security:
  - jwt: []
tags:
  - name: Auth
  - name: Utilisateurs
  - name: Référentiel
    description: Secteurs, sites et bacs
  - name: Scans
  - name: Tournées et collectes
  - name: Tri
  - name: GreenPoints
  - name: Énergie
  - name: Alertes
  - name: Supervision
    description: Vérifications, traçabilité, paramètres, journal
  - name: Simulation

paths:
  # ------------------------------------------------------------------ AUTH
  /auth/inscription/:
    post:
      operationId: auth_inscription
      tags: [Auth]
      summary: Inscription d'un citoyen (compte actif aussitôt, connecté)
      description: |
        Depuis 1.3.0 : pas de code SMS ni de validation par un référent. Le compte est créé avec
        statut_validation = valide et telephone_verifie = true, et les jetons sont renvoyés comme à la connexion.
        Le rôle est toujours fixé à citoyen par le serveur.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InscriptionRequete' }
      responses:
        '201':
          description: Compte créé et actif, jetons émis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jetons' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
  /auth/otp/verifier/:
    post:
      operationId: auth_otp_verifier
      tags: [Auth]
      summary: Vérifier le code OTP reçu par SMS
      deprecated: true
      description: Non utilisé depuis 1.3.0 (inscription sans code SMS). Gardé pour une future vérification du téléphone ; le backend peut ne pas l'implémenter.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerificationRequete' }
      responses:
        '200':
          description: Téléphone vérifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Utilisateur' }
        '400': { $ref: '#/components/responses/Validation' }
        '422': { $ref: '#/components/responses/RegleMetier' }
  /auth/otp/renvoyer/:
    post:
      operationId: auth_otp_renvoyer
      tags: [Auth]
      summary: Renvoyer un code OTP
      deprecated: true
      description: Non utilisé depuis 1.3.0 (inscription sans code SMS). Gardé pour une future vérification du téléphone ; le backend peut ne pas l'implémenter.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [telephone]
              properties:
                telephone: { $ref: '#/components/schemas/Telephone' }
      responses:
        '204': { description: Code renvoyé }
        '404': { $ref: '#/components/responses/Introuvable' }
  /auth/inscription/personnel/:
    post:
      operationId: auth_inscription_personnel
      tags: [Auth]
      summary: Inscription d'un opérateur de tri ou d'un responsable méthanisation (Control Center)
      description: |
        Depuis 1.5.0 :
        - Si validation_comptes_personnel = 1 : le compte est créé avec statut_validation = en_attente,
          notification compte_a_valider envoyée aux administrateurs.
        - Si validation_comptes_personnel = 0 : le compte est créé avec statut_validation = valide,
          sans notification.
        Dans tous les cas, aucun jeton n'est émis à la création.
        Téléphone et e-mail sont obligatoires ; chacun est unique (409 TELEPHONE_DEJA_UTILISE ou
        EMAIL_DEJA_UTILISE). L'e-mail est enregistré en minuscules.
        Seuls les rôles operateur_tri et responsable_methanisation sont acceptés ; tout autre rôle
        renvoie une erreur VALIDATION. Les administrateurs, référents et collecteurs restent préenregistrés
        ou créés par un administrateur (POST /utilisateurs/).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InscriptionPersonnelRequete' }
      responses:
        '201':
          description: Demande enregistrée, en attente de validation par un administrateur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Utilisateur' }
        '400': { $ref: '#/components/responses/Validation' }
        '409': { $ref: '#/components/responses/Conflit' }
  /auth/token/:
    post:
      operationId: auth_token
      tags: [Auth]
      summary: Connexion (tous les rôles) — obtenir les jetons JWT
      description: |
        Identifiant au choix : téléphone ou e-mail (exactement un des deux, sinon 400 VALIDATION).
        L'e-mail est comparé sans tenir compte des majuscules. Identifiant inconnu ou mauvais mot de passe : 401.
        Compte du personnel en attente ou refusé, ou compte désactivé (actif = false) : 403 COMPTE_NON_VALIDE,
        avec details.statut_validation (en_attente, refuse) ou details.actif = false. Le mot de passe est vérifié avant.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnexionRequete' }
      responses:
        '200':
          description: Jetons émis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jetons' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/AccesRefuse' }
  /auth/token/rafraichir/:
    post:
      operationId: auth_token_rafraichir
      tags: [Auth]
      summary: Obtenir un nouveau jeton d'accès
      description: Chaque refresh réussi renvoie un nouveau refresh; l'ancien est révoqué et ne peut plus être réutilisé.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh: { type: string }
      responses:
        '200':
          description: Nouveau jeton d'accès
          content:
            application/json:
              schema:
                type: object
                required: [access, refresh]
                properties:
                  access: { type: string }
                  refresh: { type: string }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/AccesRefuse' }
  /auth/deconnexion/:
    post:
      operationId: auth_deconnexion
      tags: [Auth]
      summary: Révoquer le jeton de renouvellement
      description: Requiert le jeton d'accès de son propriétaire et invalide le refresh indiqué.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh: { type: string }
      responses:
        '204': { description: Jeton révoqué }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/AccesRefuse' }
  /auth/moi/:
    get:
      operationId: auth_moi
      tags: [Auth]
      summary: Utilisateur connecté
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Utilisateur' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }

  # ------------------------------------------------------------ UTILISATEURS
  /utilisateurs/:
    get:
      operationId: utilisateurs_lister
      tags: [Utilisateurs]
      summary: Lister les utilisateurs (administrateur ; référent = citoyens de sa résidence)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/TaillePage' }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: statut_validation, in: query, schema: { $ref: '#/components/schemas/StatutValidation' } }
        - { name: bac_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Recherche' }
      responses:
        '200':
          description: Page d'utilisateurs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/Utilisateur' } }
        '403': { $ref: '#/components/responses/AccesRefuse' }
    post:
      operationId: utilisateurs_creer
      tags: [Utilisateurs]
      summary: Créer un compte (personnel ou citoyen) — administrateur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UtilisateurCreation' }
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Utilisateur' }
        '400': { $ref: '#/components/responses/Validation' }
        '409': { $ref: '#/components/responses/Conflit' }
  /utilisateurs/{id}/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: utilisateurs_detail
      tags: [Utilisateurs]
      summary: Détail d'un utilisateur
      responses:
        '200':
          description: Utilisateur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Utilisateur' }
        '404': { $ref: '#/components/responses/Introuvable' }
    patch:
      operationId: utilisateurs_modifier
      tags: [Utilisateurs]
      summary: Modifier un utilisateur (administrateur). Pas de suppression — passer actif à false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UtilisateurModification' }
      responses:
        '200':
          description: Modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Utilisateur' }
        '400': { $ref: '#/components/responses/Validation' }
        '409': { $ref: '#/components/responses/Conflit' }
  /utilisateurs/{id}/validation/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: utilisateurs_valider
      tags: [Utilisateurs]
      summary: Valider ou refuser un compte du personnel en attente (administrateur seulement) — journalisé
      description: |
        Depuis 1.3.0, seuls les comptes operateur_tri et responsable_methanisation inscrits eux-mêmes
        passent par cette validation. Un compte qui n'est pas en_attente renvoie 409 CONFLIT ; un autre rôle que
        administrateur reçoit 403 ACCES_REFUSE. Refuser laisse le compte refusé (connexion impossible).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [valider, refuser] }
                commentaire: { type: string, nullable: true }
      responses:
        '200':
          description: Décision appliquée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Utilisateur' }
        '403': { $ref: '#/components/responses/AccesRefuse' }
        '409': { $ref: '#/components/responses/Conflit' }

  # ------------------------------------------------------------- RÉFÉRENTIEL
  /secteurs/:
    get:
      operationId: secteurs_lister
      tags: [Référentiel]
      summary: Lister les secteurs (non paginé, 3 éléments)
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Secteurs
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Secteur' } }
  /secteurs/{id}/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      operationId: secteurs_modifier
      tags: [Référentiel]
      summary: Modifier un secteur (administrateur)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nom: { type: string }
                site_id: { type: string, format: uuid }
                site_repli_id: { type: string, format: uuid }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Secteur' }
  /sites/:
    get:
      operationId: sites_lister
      tags: [Référentiel]
      summary: Lister les sites de méthanisation (non paginé)
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Sites
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Site' } }
  /sites/{id}/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: sites_detail
      tags: [Référentiel]
      summary: Détail d'un site
      responses:
        '200':
          description: Site
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '404': { $ref: '#/components/responses/Introuvable' }
    patch:
      operationId: sites_modifier
      tags: [Référentiel]
      summary: Changer le statut d'un site (responsable méthanisation, administrateur)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                statut: { $ref: '#/components/schemas/StatutSite' }
                nom: { type: string }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
  /sites/{id}/mesures/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: sites_mesures_envoyer
      tags: [Énergie]
      summary: Envoyer la mesure journalière du site (capteur ou simulateur)
      description: |
        Met à jour la ProductionEnergie du jour : écart, énergie et digestat.
        Crée ou met à jour une Alerte si l'écart arrondi à 0,1 % atteint le seuil, ou si ch4_pct < ch4_min_pct.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MesureSite' }
      responses:
        '200':
          description: Production du jour mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionEnergie' }
        '400': { $ref: '#/components/responses/Validation' }
  /bacs/:
    get:
      operationId: bacs_lister
      tags: [Référentiel]
      summary: Lister les bacs
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/TaillePage' }
        - { name: code, in: query, description: 'Recherche exacte par code (ex. BAC-014)', schema: { type: string } }
        - { name: secteur_id, in: query, schema: { type: string, format: uuid } }
        - { name: statut, in: query, schema: { $ref: '#/components/schemas/StatutBac' } }
        - { $ref: '#/components/parameters/Recherche' }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Page de bacs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/Bac' } }
    post:
      operationId: bacs_creer
      tags: [Référentiel]
      summary: Créer un bac (administrateur). Le code est attribué par le serveur.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BacEcriture' }
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bac' }
        '400': { $ref: '#/components/responses/Validation' }
  /bacs/{id}/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: bacs_detail
      tags: [Référentiel]
      summary: Détail d'un bac
      responses:
        '200':
          description: Bac
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bac' }
        '404': { $ref: '#/components/responses/Introuvable' }
    patch:
      operationId: bacs_modifier
      tags: [Référentiel]
      summary: Modifier ou désactiver un bac (administrateur)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BacEcriture' }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bac' }
  /bacs/{id}/tracabilite/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: bacs_tracabilite
      tags: [Supervision]
      summary: Historique complet d'un bac (administrateur ou référent affecté à ce bac)
      responses:
        '200':
          description: Traçabilité
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TracabiliteBac' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '403': { $ref: '#/components/responses/AccesRefuse' }

  # ------------------------------------------------------------------- SCANS
  /scans/:
    get:
      operationId: scans_lister
      tags: [Scans]
      summary: Lister les scans (citoyen propriétaire, collecteur affecté, référent du bac ou administrateur)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/TaillePage' }
        - { name: citoyen_id, in: query, schema: { type: string, format: uuid } }
        - { name: bac_id, in: query, schema: { type: string, format: uuid } }
        - { name: statut, in: query, schema: { $ref: '#/components/schemas/StatutScan' } }
        - { $ref: '#/components/parameters/DateDebut' }
        - { $ref: '#/components/parameters/DateFin' }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Page de scans, du plus récent au plus ancien
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/Scan' } }
    post:
      operationId: scans_creer
      tags: [Scans]
      summary: Scanner son bac (citoyen)
      description: |
        Le serveur renvoie toujours le scan enregistré avec son statut ; seuls `valide` et `non_localise` comptent.
        Un second scan dans les 10 secondes est un doublon : réponse 200 avec le scan existant.
        Un compte désactivé (actif = false) reçoit 422 COMPTE_NON_VALIDE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanRequete' }
      responses:
        '201':
          description: Scan enregistré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scan' }
        '200':
          description: Doublon — scan existant renvoyé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scan' }
        '422': { $ref: '#/components/responses/RegleMetier' }

  # ------------------------------------------------------ TOURNÉES & COLLECTES
  /tournees/:
    get:
      operationId: tournees_lister
      tags: [Tournées et collectes]
      summary: Lister les tournées (un collecteur ne voit que les siennes)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/TaillePage' }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: statut, in: query, schema: { $ref: '#/components/schemas/StatutTournee' } }
        - { name: secteur_id, in: query, schema: { type: string, format: uuid } }
        - { name: collecteur_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Page de tournées
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/Tournee' } }
    post:
      operationId: tournees_creer
      tags: [Tournées et collectes]
      summary: Planifier une tournée (administrateur). Site et motif d'affectation calculés par le serveur.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TourneeCreation' }
      responses:
        '201':
          description: Créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TourneeDetail' }
        '400': { $ref: '#/components/responses/Validation' }
  /tournees/{id}/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: tournees_detail
      tags: [Tournées et collectes]
      summary: Détail d'une tournée avec ses bacs et collectes
      responses:
        '200':
          description: Tournée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TourneeDetail' }
        '404': { $ref: '#/components/responses/Introuvable' }
  /tournees/{id}/demarrer/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: tournees_demarrer
      tags: [Tournées et collectes]
      summary: Démarrer la tournée (collecteur) — planifiee → en_cours
      responses:
        '200':
          description: Tournée démarrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TourneeDetail' }
        '422': { $ref: '#/components/responses/RegleMetier' }
  /tournees/{id}/collectes/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: tournees_collectes_ouvrir
      tags: [Tournées et collectes]
      summary: Identifier un bac et ouvrir sa collecte (collecteur)
      description: |
        Crée la collecte au statut `en_attente_pesee`. En démo, le simulateur IoT envoie aussitôt la pesée :
        le collecteur rafraîchit la collecte (GET /collectes/{id}/) jusqu'au statut `pesee`.
        Erreurs : 422 BAC_HORS_TOURNEE, 409 BAC_DEJA_COLLECTE, 422 TOURNEE_STATUT_INVALIDE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code_bac]
              properties:
                code_bac: { type: string, example: BAC-014 }
      responses:
        '201':
          description: Collecte ouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collecte' }
        '409': { $ref: '#/components/responses/Conflit' }
        '422': { $ref: '#/components/responses/RegleMetier' }
  /tournees/{id}/cloturer/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: tournees_cloturer
      tags: [Tournées et collectes]
      summary: Clôturer la tournée (collecteur) — en_cours → collectee. Toutes les collectes ouvertes doivent être validées.
      responses:
        '200':
          description: Tournée clôturée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TourneeDetail' }
        '422': { $ref: '#/components/responses/RegleMetier' }
  /collectes/:
    get:
      operationId: collectes_lister
      tags: [Tournées et collectes]
      summary: Lister les collectes
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/TaillePage' }
        - { name: tournee_id, in: query, schema: { type: string, format: uuid } }
        - { name: bac_id, in: query, schema: { type: string, format: uuid } }
        - { name: statut, in: query, schema: { $ref: '#/components/schemas/StatutCollecte' } }
        - { name: statut_controle, in: query, schema: { $ref: '#/components/schemas/StatutControle' } }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Page de collectes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/Collecte' } }
  /collectes/{id}/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: collectes_detail
      tags: [Tournées et collectes]
      summary: Détail d'une collecte
      responses:
        '200':
          description: Collecte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collecte' }
        '404': { $ref: '#/components/responses/Introuvable' }
  /collectes/{id}/pesee/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: collectes_pesee
      tags: [Tournées et collectes]
      summary: Enregistrer la pesée (capteur ou simulateur IoT) — en_attente_pesee → pesee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeseeRequete' }
      responses:
        '200':
          description: Pesée enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collecte' }
        '422': { $ref: '#/components/responses/RegleMetier' }
  /collectes/{id}/valider/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: collectes_valider
      tags: [Tournées et collectes]
      summary: Valider la collecte (collecteur) — pesee → validee
      description: Calcule kg_par_scan et statut_controle, puis remet à zéro le compteur de scans du bac.
      responses:
        '200':
          description: Collecte validée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collecte' }
        '409': { $ref: '#/components/responses/Conflit' }
        '422': { $ref: '#/components/responses/RegleMetier' }
  /collectes/{id}/decision/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: collectes_decider
      tags: [Supervision]
      summary: Décider d'une collecte « à vérifier » (administrateur) — journalisé
      description: valider_points crédite les transactions en attente ; annuler_points les annule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, commentaire]
              properties:
                decision: { type: string, enum: [valider_points, annuler_points] }
                commentaire: { type: string }
      responses:
        '200':
          description: Décision appliquée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collecte' }
        '422': { $ref: '#/components/responses/RegleMetier' }

  # --------------------------------------------------------------------- TRI
  /tournees/{id}/tri/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: tournees_tri_lire
      tags: [Tri]
      summary: Résultat du tri d'une tournée (opérateur de tri ou administrateur)
      responses:
        '200':
          description: Résultat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultatTri' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '403': { $ref: '#/components/responses/AccesRefuse' }
    post:
      operationId: tournees_tri_valider
      tags: [Tri]
      summary: Saisir et valider le tri (opérateur de tri) — déclenche le pipeline
      description: |
        Transaction atomique : contrôle de cohérence, lots, GreenPoints, envoi de l'organique au site.
        Si l'écart dépasse tolerance_tri_pct et que motif_ecart est absent : 422 ECART_TOLERANCE
        (details.ecart_pct renseigné). Une tournée ne peut être triée qu'une fois (409 CONFLIT).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriRequete' }
      responses:
        '201':
          description: Tri validé, pipeline exécuté
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultatTri' }
        '400': { $ref: '#/components/responses/Validation' }
        '409': { $ref: '#/components/responses/Conflit' }
        '422': { $ref: '#/components/responses/RegleMetier' }
  /lots/:
    get:
      operationId: lots_lister
      tags: [Tri]
      summary: Lister les lots triés (opérateur de tri ou administrateur)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/TaillePage' }
        - { name: tournee_id, in: query, schema: { type: string, format: uuid } }
        - { name: categorie, in: query, schema: { $ref: '#/components/schemas/Categorie' } }
        - { $ref: '#/components/parameters/DateDebut' }
        - { $ref: '#/components/parameters/DateFin' }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Page de lots
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/LotTrie' } }

  # -------------------------------------------------------------- GREENPOINTS
  /greenpoints/solde/:
    get:
      operationId: greenpoints_solde
      tags: [GreenPoints]
      summary: Solde du citoyen connecté (ou d'un citoyen donné pour l'administrateur)
      parameters:
        - { name: citoyen_id, in: query, description: Administrateur uniquement, schema: { type: string, format: uuid } }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Solde
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Solde' }
  /greenpoints/transactions/:
    get:
      operationId: greenpoints_transactions_lister
      tags: [GreenPoints]
      summary: Historique des gains (un citoyen ne voit que les siens)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/TaillePage' }
        - { name: citoyen_id, in: query, schema: { type: string, format: uuid } }
        - { name: tournee_id, in: query, schema: { type: string, format: uuid } }
        - { name: statut, in: query, schema: { $ref: '#/components/schemas/StatutTransaction' } }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Page de transactions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/GreenPointsTransaction' } }
  /recompenses/:
    get:
      operationId: recompenses_lister
      tags: [GreenPoints]
      summary: Catalogue des récompenses (non paginé)
      parameters:
        - { name: actif, in: query, schema: { type: boolean } }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Récompenses
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Recompense' } }
    post:
      operationId: recompenses_creer
      tags: [GreenPoints]
      summary: Ajouter une récompense (administrateur)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecompenseEcriture' }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '201':
          description: Créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recompense' }
  /recompenses/{id}/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      operationId: recompenses_modifier
      tags: [GreenPoints]
      summary: Modifier une récompense (administrateur)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecompenseEcriture' }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Modifiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recompense' }
  /echanges/:
    get:
      operationId: echanges_lister
      tags: [GreenPoints]
      summary: Historique des échanges (un citoyen ne voit que les siens)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/TaillePage' }
        - { name: citoyen_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Page d'échanges
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/Echange' } }
    post:
      operationId: echanges_creer
      tags: [GreenPoints]
      summary: Échanger des points contre une récompense (citoyen) — 422 SOLDE_INSUFFISANT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recompense_id]
              properties:
                recompense_id: { type: string, format: uuid }
      responses:
        '201':
          description: Échange effectué
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Echange' }
        '422': { $ref: '#/components/responses/RegleMetier' }

  # ------------------------------------------------------------------ ÉNERGIE
  /productions/:
    get:
      operationId: productions_lister
      tags: [Énergie]
      summary: Productions journalières par site (administrateur ou responsable méthanisation)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/TaillePage' }
        - { name: site_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/DateDebut' }
        - { $ref: '#/components/parameters/DateFin' }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Page de productions, de la plus récente à la plus ancienne
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/ProductionEnergie' } }
  /productions/globale/:
    get:
      operationId: productions_globale
