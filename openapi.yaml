      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Agrégat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionGlobale' }
  /productions/{id}/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: productions_detail
      tags: [Énergie]
      summary: Détail d'une production journalière (administrateur ou responsable méthanisation)
      responses:
        '200':
          description: Production
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionEnergie' }
        '404': { $ref: '#/components/responses/Introuvable' }
  /productions/{id}/cloturer/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: productions_cloturer
