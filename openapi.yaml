  # --------------------------------------------------------------- SUPERVISION
  /verifications/:
    get:
      operationId: verifications_lister
      tags: [Supervision]
      summary: File de vérification (administrateur ; référent = sa résidence, sans les comptes en attente)
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/TypeVerification' } }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Éléments à traiter (non paginé), du plus ancien au plus récent
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ElementVerification' } }
  /parametres/:
    get:
      operationId: parametres_lister
      tags: [Supervision]
      summary: Table des paramètres système (administrateur)
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Paramètres
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Parametre' } }
  /parametres/{cle}/:
    parameters:
      - { name: cle, in: path, required: true, schema: { $ref: '#/components/schemas/CleParametre' } }
    patch:
      operationId: parametres_modifier
      tags: [Supervision]
      summary: Modifier un paramètre (administrateur) — pris en compte au calcul suivant, journalisé
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valeur]
              properties:
                valeur: { type: number, example: 0.12 }
      responses:
        '200':
          description: Modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parametre' }
        '422': { $ref: '#/components/responses/RegleMetier' }
  /journal/:
    get:
      operationId: journal_lister
      tags: [Supervision]
      summary: Journal d'audit (administrateur)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/TaillePage' }
        - { name: objet_type, in: query, schema: { $ref: '#/components/schemas/TypeObjet' } }
        - { name: objet_id, in: query, schema: { type: string } }
        - { name: auteur_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Page d'entrées, de la plus récente à la plus ancienne
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/EntreeJournal' } }

  # --------------------------------------------------------------- SIMULATION
  /simulation/scenarios/:
    get:
      operationId: simulation_scenarios_lister
      tags: [Simulation]
      summary: Scénarios de démo actifs (administrateur)
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Scénarios
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ScenarioSimulation' } }
    post:
      operationId: simulation_scenarios_creer
      tags: [Simulation]
      summary: Forcer le facteur de mesure d'un site (ex. 0,70 pour déclencher l'alerte à −30 %)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScenarioSimulation' }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '201':
          description: Scénario actif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioSimulation' }
  /simulation/scenarios/{site_id}/:
    parameters:
      - { name: site_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: simulation_scenarios_supprimer
      tags: [Simulation]
      summary: Revenir au fonctionnement nominal (facteur aléatoire 0,95-1,05)
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '204': { description: Scénario supprimé }

components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        En-tête `Authorization: Bearer <access>`. Jeton d'accès valable 60 min, jeton de rafraîchissement 7 jours.
        Revendications : user_id (UUID), role, nom, exp.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    TaillePage:
      name: taille_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Recherche:
      name: recherche
      in: query
      description: Recherche texte (nom, code, résidence, téléphone selon la ressource)
      schema: { type: string }
    DateDebut:
      name: date_debut
      in: query
      description: Date incluse (AAAA-MM-JJ)
      schema: { type: string, format: date }
    DateFin:
      name: date_fin
      in: query
      description: Date incluse (AAAA-MM-JJ)
      schema: { type: string, format: date }

  responses:
    Validation:
      description: Requête invalide (code VALIDATION ; details = { champ → [messages] })
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }
          example: { code: VALIDATION, message: Données invalides, details: { telephone: [Ce champ est obligatoire.] } }
    NonAuthentifie:
      description: Jeton absent, invalide ou expiré
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }
          example: { code: NON_AUTHENTIFIE, message: Authentification requise, details: {} }
    AccesRefuse:
      description: Rôle non autorisé pour cette action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }
          example: { code: ACCES_REFUSE, message: Action réservée à l'administrateur, details: {} }
    Introuvable:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }
          example: { code: INTROUVABLE, message: Bac introuvable, details: {} }
    Conflit:
      description: Conflit avec l'état actuel (doublon, déjà fait)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }
          example: { code: BAC_DEJA_COLLECTE, message: Ce bac a déjà été collecté dans cette tournée, details: {} }
    RegleMetier:
      description: Règle métier non respectée
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }
          example: { code: ECART_TOLERANCE, message: L'écart de tri dépasse la tolérance, details: { ecart_pct: 3.4, tolerance_pct: 2 } }

  schemas:
    # ------------------------------------------------------------- COMMUNS
    Erreur:
      type: object
      required: [code, message, details]
      properties:
        code: { $ref: '#/components/schemas/CodeErreur' }
        message: { type: string, description: 'Message lisible en français, affichable tel quel' }
        details: { type: object, additionalProperties: true }
    CodeErreur:
      type: string
      enum:
        - VALIDATION
        - NON_AUTHENTIFIE
        - ACCES_REFUSE
        - INTROUVABLE
        - CONFLIT
        - TELEPHONE_DEJA_UTILISE
        - EMAIL_DEJA_UTILISE
        - OTP_INVALIDE
        - OTP_EXPIRE
        - COMPTE_NON_VALIDE
        - TOURNEE_STATUT_INVALIDE
        - COLLECTE_STATUT_INVALIDE
        - BAC_HORS_TOURNEE
        - BAC_DEJA_COLLECTE
        - POIDS_INVALIDE
        - ECART_TOLERANCE
        - SOLDE_INSUFFISANT
        - RECOMPENSE_INACTIVE
        - JOURNEE_CLOTUREE
        - PARAMETRE_INVALIDE
        - ERREUR_SERVEUR
    Page:
      type: object
      required: [count, next, previous, results]
      properties:
        count: { type: integer, example: 1 }
        next: { type: string, nullable: true, example: null }
        previous: { type: string, nullable: true, example: null }
        results: { type: array, items: {} }
    Telephone:
      type: string
      description: Format international E.164 (Côte d'Ivoire +225 et 10 chiffres)
      pattern: '^\+225[0-9]{10}$'
      example: '+2250701020304'
    DateHeure:
      type: string
      format: date-time
      example: '2026-09-12T08:30:00Z'

    # --------------------------------------------------------------- ENUMS
    Role:
      type: string
      enum: [citoyen, collecteur, operateur_tri, responsable_methanisation, referent, administrateur, capteur]
      description: capteur = compte de service utilisé par le simulateur IoT et, plus tard, les vrais capteurs
    StatutValidation: { type: string, enum: [en_attente, valide, refuse] }
    StatutBac: { type: string, enum: [actif, inactif] }
    StatutSite: { type: string, enum: [nominal, alerte, maintenance] }
    StatutScan:
      type: string
      enum: [valide, non_localise, hors_zone, refuse_plafond]
      description: Seuls valide et non_localise comptent dans la répartition
    StatutTournee: { type: string, enum: [planifiee, en_cours, collectee, triee] }
    MotifAffectation: { type: string, enum: [secteur, repli] }
    StatutCollecte: { type: string, enum: [en_attente_pesee, pesee, validee] }
    StatutControle:
      type: string
      enum: [normal, a_verifier, points_valides, points_annules]
      description: Calculé à la validation ; a_verifier si kg_par_scan < seuil_kg_par_scan
    SourceMesure: { type: string, enum: [simule, capteur] }
    NiveauContamination: { type: string, enum: [faible, moyen, eleve] }
    Categorie: { type: string, enum: [organique, biomasse, plastique, metal, carton_papier, verre, refus] }
    Destination:
      type: string
      enum: [digesteur, unite_biomasse, recycleur, enfouissement]
      description: Déduite de la catégorie par le serveur
    StatutTransaction: { type: string, enum: [creditee, en_attente, annulee] }
    TypeAlerte: { type: string, enum: [production, composition] }
    StatutAlerte: { type: string, enum: [ouverte, resolue] }
    StatutJournee: { type: string, enum: [ouverte, cloturee] }
    DestinationDigestat: { type: string, enum: [vente_agricole, stockage] }
    StatutDonnee:
      type: string
      enum: [mesure, estime, simule]
      description: Badge affiché à côté de chaque indicateur (CDC §7)
    TypeVerification:
      type: string
      enum: [collecte_a_verifier, compte_en_attente, scan_hors_zone, scan_non_localise, bac_surinscrit]
      description: "compte_en_attente = compte du personnel qui attend un administrateur (1.3.0 ; plus de citoyens). bac_surinscrit reste un signal : il ne bloque aucun compte."
    TypeObjet: { type: string, enum: [utilisateur, bac, scan, tournee, collecte, lot, transaction, production, alerte, parametre, site, secteur] }
    StatutParametre: { type: string, enum: [aligne, illustratif, a_sourcer, a_calibrer, v2] }
    CleParametre:
      type: string
      enum:
        - coefficient_filiere_organique
        - coefficient_filiere_biomasse
        - coefficient_filiere_plastique
        - coefficient_filiere_metal
        - coefficient_filiere_carton_papier
        - coefficient_filiere_verre
        - coefficient_filiere_refus
        - coefficient_qualite_faible
        - coefficient_qualite_moyen
        - coefficient_qualite_eleve
        - max_scans_par_jour
        - rayon_scan_m
        - seuil_kg_par_scan
        - duree_periode_collecte_jours
        - tolerance_tri_pct
        - coefficient_biogaz_m3_par_kg
        - coefficient_electricite_kwh_par_m3
        - coefficient_chaleur_kwh_par_m3
        - part_cuisson_pct
        - conso_cuisson_foyer_m3_jour
        - part_perte_pct
        - conso_electrique_foyer_kwh_an
        - coefficient_digestat
        - seuil_alerte_production_pct
        - ch4_min_pct
        - fenetre_lissage_jours
        - validation_comptes_personnel

    # --------------------------------------------------------- UTILISATEURS
    Utilisateur:
      type: object
      required: [id, nom, telephone, role, actif, statut_validation, date_creation, profil_citoyen]
      properties:
        id: { type: string, format: uuid, readOnly: true, example: a0000000-0000-4000-8000-000000000101 }
        nom: { type: string, example: Awa Koné }
        telephone: { $ref: '#/components/schemas/Telephone' }
        email: { type: string, format: email, nullable: true, description: 'Unique quand il est renseigné ; sert aussi d’identifiant de connexion', example: null }
        role: { $ref: '#/components/schemas/Role' }
        actif: { type: boolean, example: true }
        statut_validation:
          description: "État du compte (1.3.0). valide pour tous les comptes, sauf le personnel inscrit lui-même : en_attente jusqu'à la décision d'un administrateur, puis valide ou refuse."
          allOf: [{ $ref: '#/components/schemas/StatutValidation' }]
        date_creation: { $ref: '#/components/schemas/DateHeure' }
        profil_citoyen:
          description: Renseigné uniquement si role = citoyen, sinon null
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ProfilCitoyen' }]
    ProfilCitoyen:
      type: object
      required: [bac_id, code_bac, telephone_verifie, statut_validation, date_inscription]
      properties:
        bac_id: { type: string, format: uuid, example: bac00000-0000-4000-8000-000000000014 }
        code_bac: { type: string, readOnly: true, example: BAC-014 }
        telephone_verifie: { type: boolean, readOnly: true, example: true, description: Toujours true depuis 1.3.0 (pas de code SMS) }
        statut_validation:
          description: Toujours valide depuis 1.3.0 (gardé pour compatibilité ; l'état du compte est Utilisateur.statut_validation)
          allOf: [{ $ref: '#/components/schemas/StatutValidation' }]
        date_inscription: { $ref: '#/components/schemas/DateHeure' }
    InscriptionRequete:
      type: object
      required: [nom, telephone, mot_de_passe, code_bac]
      properties:
        nom: { type: string, example: Awa Koné }
        telephone: { $ref: '#/components/schemas/Telephone' }
        mot_de_passe: { type: string, format: password, minLength: 8, example: greengas2026 }
        code_bac: { type: string, example: BAC-014 }
    InscriptionPersonnelRequete:
      type: object
      required: [nom, telephone, email, mot_de_passe, role]
      properties:
        nom: { type: string, example: Aya Opératrice }
        telephone: { $ref: '#/components/schemas/Telephone' }
        email: { type: string, format: email, example: aya.operatrice@greengas.ci }
        mot_de_passe: { type: string, format: password, minLength: 8, example: greengas2026 }
        role:
          type: string
          enum: [operateur_tri, responsable_methanisation]
          description: Seuls rôles ouverts à l'inscription dans le Control Center
    OtpVerificationRequete:
      type: object
      required: [telephone, code]
      properties:
        telephone: { $ref: '#/components/schemas/Telephone' }
        code: { type: string, pattern: '^[0-9]{6}$', example: '123456' }
    ConnexionRequete:
      type: object
      description: Identifiant au choix, téléphone ou e-mail (exactement un des deux).
      required: [mot_de_passe]
      properties:
        telephone: { $ref: '#/components/schemas/Telephone' }
        email: { type: string, format: email, example: aya.operatrice@greengas.ci }
        mot_de_passe: { type: string, format: password, example: greengas2026 }
    Jetons:
      type: object
      required: [access, refresh, utilisateur]
      properties:
        access: { type: string, example: eyJhbGciOiJIUzI1NiJ9.accès }
        refresh: { type: string, example: eyJhbGciOiJIUzI1NiJ9.rafraichissement }
        utilisateur: { $ref: '#/components/schemas/Utilisateur' }
    UtilisateurCreation:
      type: object
      required: [nom, telephone, mot_de_passe, role]
      properties:
        nom: { type: string, example: Koffi Yao }
        telephone: { $ref: '#/components/schemas/Telephone' }
        email: { type: string, format: email, nullable: true }
        mot_de_passe: { type: string, format: password, minLength: 8 }
        role: { $ref: '#/components/schemas/Role' }
        bac_id: { type: string, format: uuid, nullable: true, description: Obligatoire si role = citoyen ou referent }
    UtilisateurModification:
      type: object
      properties:
        nom: { type: string }
        email: { type: string, format: email, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        actif: { type: boolean }
        bac_id: { type: string, format: uuid, nullable: true }

    # ---------------------------------------------------------- RÉFÉRENTIEL
    Secteur:
      type: object
      required: [id, code, nom, site_id, site_repli_id]
      properties:
        id: { type: string, format: uuid, readOnly: true, example: 5ec70000-0000-4000-8000-000000000001 }
        code: { type: string, enum: [NORD, EST, OUEST], readOnly: true, example: NORD }
        nom: { type: string, example: Secteur Nord (Cocody) }
        site_id: { type: string, format: uuid, example: d1900000-0000-4000-8000-000000000001 }
        site_repli_id: { type: string, format: uuid, example: d1900000-0000-4000-8000-000000000002 }
    Site:
      type: object
      required: [id, code, nom, statut, capacite_kg_jour, latitude, longitude, alertes_ouvertes]
      properties:
        id: { type: string, format: uuid, readOnly: true, example: d1900000-0000-4000-8000-000000000001 }
        code: { type: string, readOnly: true, pattern: '^DIG-[0-9]{2}$', example: DIG-01 }
        nom: { type: string, example: Site Nord }
        statut: { $ref: '#/components/schemas/StatutSite' }
        capacite_kg_jour: { type: number, example: 2000 }
        latitude: { type: number, example: 5.3599 }
        longitude: { type: number, example: -3.9871 }
        alertes_ouvertes: { type: integer, readOnly: true, example: 0 }
    Bac:
      type: object
      required: [id, code, residence, secteur_id, nb_foyers_declares, latitude, longitude, tare_kg, capacite_kg, statut,
        scans_valides_periode, nb_citoyens_valides, date_derniere_collecte, date_creation]
      properties:
        id: { type: string, format: uuid, readOnly: true, example: bac00000-0000-4000-8000-000000000014 }
        code: { type: string, readOnly: true, pattern: '^BAC-[0-9]{3}$', example: BAC-014 }
        residence: { type: string, example: Résidence Atlantic }
        secteur_id: { type: string, format: uuid, example: 5ec70000-0000-4000-8000-000000000001 }
        nb_foyers_declares: { type: integer, minimum: 1, example: 6 }
        latitude: { type: number, example: 5.3612 }
        longitude: { type: number, example: -3.9905 }
        tare_kg: { type: number, example: 12.5 }
        capacite_kg: { type: number, example: 120 }
        statut: { $ref: '#/components/schemas/StatutBac' }
        scans_valides_periode: { type: integer, readOnly: true, description: Scans comptés depuis la dernière collecte, example: 22 }
        nb_citoyens_valides: { type: integer, readOnly: true, example: 4 }
        date_derniere_collecte: { type: string, format: date-time, nullable: true, readOnly: true }
        date_creation: { $ref: '#/components/schemas/DateHeure' }
    BacEcriture:
      type: object
      properties:
        residence: { type: string }
        secteur_id: { type: string, format: uuid }
        nb_foyers_declares: { type: integer, minimum: 1 }
        latitude: { type: number }
        longitude: { type: number }
        tare_kg: { type: number }
        capacite_kg: { type: number }
        statut: { $ref: '#/components/schemas/StatutBac' }

    # ------------------------------------------------------------------ SCANS
    ScanRequete:
      type: object
      required: [code_bac]
      properties:
        code_bac: { type: string, example: BAC-014 }
        latitude: { type: number, nullable: true, example: 5.3613 }
        longitude: { type: number, nullable: true, example: -3.9904 }
    Scan:
      type: object
      required: [id, citoyen_id, bac_id, code_bac, horodatage, latitude, longitude, distance_m, statut, compte]
      properties:
        id: { type: string, format: uuid, readOnly: true, example: 5ca00000-0000-4000-8000-000000000001 }
        citoyen_id: { type: string, format: uuid, example: a0000000-0000-4000-8000-000000000101 }
        bac_id: { type: string, format: uuid, example: bac00000-0000-4000-8000-000000000014 }
        code_bac: { type: string, example: BAC-014 }
        horodatage: { $ref: '#/components/schemas/DateHeure' }
        latitude: { type: number, nullable: true, example: 5.3613 }
        longitude: { type: number, nullable: true, example: -3.9904 }
        distance_m: { type: number, nullable: true, description: Distance au bac calculée par le serveur, example: 14.2 }
        statut: { $ref: '#/components/schemas/StatutScan' }
        compte: { type: boolean, description: true si le scan entre dans la répartition, example: true }

    # ------------------------------------------------------ TOURNÉES & COLLECTES
    Tournee:
      type: object
      required: [id, code, date, secteur_id, site_id, code_site, motif_affectation, collecteur_id, statut,
        niveau_contamination, nb_bacs, nb_bacs_collectes, poids_collecte_kg]
      properties:
        id: { type: string, format: uuid, readOnly: true, example: 70e00000-0000-4000-8000-000000000001 }
        code: { type: string, readOnly: true, pattern: '^TRN-[0-9]{4}-[0-9]{2}$', example: TRN-0912-01 }
        date: { type: string, format: date, example: '2026-09-12' }
        secteur_id: { type: string, format: uuid, example: 5ec70000-0000-4000-8000-000000000001 }
        site_id: { type: string, format: uuid, readOnly: true, example: d1900000-0000-4000-8000-000000000001 }
        code_site: { type: string, readOnly: true, example: DIG-01 }
        motif_affectation: { $ref: '#/components/schemas/MotifAffectation' }
        collecteur_id: { type: string, format: uuid, example: a0000000-0000-4000-8000-000000000002 }
        statut: { $ref: '#/components/schemas/StatutTournee' }
        niveau_contamination: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/NiveauContamination' }], description: Renseigné au tri }
        nb_bacs: { type: integer, readOnly: true, example: 3 }
        nb_bacs_collectes: { type: integer, readOnly: true, example: 3 }
        poids_collecte_kg: { type: number, readOnly: true, description: Somme des poids nets des collectes validées, example: 500 }
    TourneeDetail:
      allOf:
        - $ref: '#/components/schemas/Tournee'
        - type: object
          required: [bacs, collectes]
          properties:
            bacs: { type: array, items: { $ref: '#/components/schemas/Bac' } }
            collectes: { type: array, items: { $ref: '#/components/schemas/Collecte' } }
    TourneeCreation:
      type: object
      required: [date, secteur_id, collecteur_id, bac_ids]
      properties:
        date: { type: string, format: date }
        secteur_id: { type: string, format: uuid }
        collecteur_id: { type: string, format: uuid }
        bac_ids: { type: array, minItems: 1, items: { type: string, format: uuid } }
    Collecte:
      type: object
      required: [id, tournee_id, bac_id, code_bac, collecteur_id, statut, poids_brut_kg, tare_kg, poids_net_kg, source,
        scans_valides, kg_par_scan, statut_controle, date_ouverture, date_pesee, date_validation]
      properties:
        id: { type: string, format: uuid, readOnly: true, example: c0110000-0000-4000-8000-000000000001 }
        tournee_id: { type: string, format: uuid, example: 70e00000-0000-4000-8000-000000000001 }
        bac_id: { type: string, format: uuid, example: bac00000-0000-4000-8000-000000000014 }
        code_bac: { type: string, example: BAC-014 }
        collecteur_id: { type: string, format: uuid, example: a0000000-0000-4000-8000-000000000002 }
        statut: { $ref: '#/components/schemas/StatutCollecte' }
        poids_brut_kg: { type: number, nullable: true, example: 46.5 }
        tare_kg: { type: number, example: 12.5 }
        poids_net_kg: { type: number, nullable: true, description: poids_brut_kg − tare_kg, example: 34 }
        source: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/SourceMesure' }] }
        scans_valides: { type: integer, nullable: true, description: Figé à la validation, example: 22 }
        kg_par_scan: { type: number, nullable: true, example: 1.55 }
        statut_controle: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/StatutControle' }] }
        date_ouverture: { $ref: '#/components/schemas/DateHeure' }
        date_pesee: { type: string, format: date-time, nullable: true }
        date_validation: { type: string, format: date-time, nullable: true }
    PeseeRequete:
      type: object
      required: [poids_brut_kg, source]
      properties:
        poids_brut_kg: { type: number, exclusiveMinimum: true, minimum: 0, example: 46.5 }
        source: { $ref: '#/components/schemas/SourceMesure' }

    # --------------------------------------------------------------------- TRI
    TriRequete:
      type: object
      required: [niveau_contamination, lots]
      properties:
        niveau_contamination: { $ref: '#/components/schemas/NiveauContamination' }
        lots:
          type: array
          minItems: 1
          description: Une entrée par catégorie au plus
          items:
            type: object
            required: [categorie, poids_kg]
            properties:
              categorie: { $ref: '#/components/schemas/Categorie' }
              poids_kg: { type: number, minimum: 0, example: 320 }
        motif_ecart: { type: string, nullable: true, description: Obligatoire si l'écart dépasse tolerance_tri_pct }
    LotTrie:
      type: object
      required: [id, code_lot, tournee_id, categorie, poids_kg, part_pct, destination, site_id]
      properties:
        id: { type: string, format: uuid, readOnly: true, example: 107e0000-0000-4000-8000-000000000001 }
        code_lot: { type: string, readOnly: true, pattern: '^(ORG|BIO|PLA|MET|CAR|VER|REF)-[0-9]{4}$', example: ORG-0258 }
        tournee_id: { type: string, format: uuid, example: 70e00000-0000-4000-8000-000000000001 }
        categorie: { $ref: '#/components/schemas/Categorie' }
        poids_kg: { type: number, example: 320 }
        part_pct: { type: number, readOnly: true, example: 64 }
        destination: { $ref: '#/components/schemas/Destination' }
        site_id: { type: string, format: uuid, nullable: true, description: Renseigné pour la catégorie organique, example: d1900000-0000-4000-8000-000000000001 }
    ResultatTri:
      type: object
      required: [tournee_id, code_tournee, niveau_contamination, coef_qualite, poids_collecte_kg, poids_trie_kg, ecart_pct,
        motif_ecart, valeur_kg, lots, nb_transactions, points_credites, points_en_attente, production_id, date_validation, valide_par_id]
      properties:
        tournee_id: { type: string, format: uuid, example: 70e00000-0000-4000-8000-000000000001 }
        code_tournee: { type: string, example: TRN-0912-01 }
        niveau_contamination: { $ref: '#/components/schemas/NiveauContamination' }
        coef_qualite: { type: number, example: 1.0 }
        poids_collecte_kg: { type: number, example: 500 }
        poids_trie_kg: { type: number, example: 500 }
        ecart_pct: { type: number, example: 0 }
        motif_ecart: { type: string, nullable: true, example: null }
        valeur_kg: { type: number, description: Points par kg pour la tournée (Σ part × coefficient de filière), example: 8.54 }
        lots: { type: array, items: { $ref: '#/components/schemas/LotTrie' } }
        nb_transactions: { type: integer, example: 4 }
        points_credites: { type: integer, example: 288 }
        points_en_attente: { type: integer, example: 0 }
        production_id: { type: string, format: uuid, nullable: true, example: 9d000000-0000-4000-8000-000000000001 }
        date_validation: { $ref: '#/components/schemas/DateHeure' }
        valide_par_id: { type: string, format: uuid, example: a0000000-0000-4000-8000-000000000003 }

    # -------------------------------------------------------------- GREENPOINTS
    GreenPointsTransaction:
      type: object
      required: [id, citoyen_id, bac_id, tournee_id, collecte_id, code_tournee, scans_citoyen, scans_bac, poids_attribue_kg,
        valeur_kg, coef_qualite, points, statut, date]
      properties:
        id: { type: string, format: uuid, readOnly: true, example: 9b000000-0000-4000-8000-000000000001 }
        citoyen_id: { type: string, format: uuid, example: a0000000-0000-4000-8000-000000000101 }
        bac_id: { type: string, format: uuid, example: bac00000-0000-4000-8000-000000000014 }
        tournee_id: { type: string, format: uuid, example: 70e00000-0000-4000-8000-000000000001 }
        collecte_id: { type: string, format: uuid, example: c0110000-0000-4000-8000-000000000001 }
        code_tournee: { type: string, example: TRN-0912-01 }
        scans_citoyen: { type: integer, example: 8 }
        scans_bac: { type: integer, example: 22 }
        poids_attribue_kg: { type: number, example: 12.36 }
        valeur_kg: { type: number, example: 8.54 }
        coef_qualite: { type: number, example: 1.0 }
        points: { type: integer, description: Arrondi à l'entier inférieur, example: 105 }
        statut: { $ref: '#/components/schemas/StatutTransaction' }
        date: { $ref: '#/components/schemas/DateHeure' }
    Solde:
      type: object
      required: [citoyen_id, solde, points_en_attente, total_gagne, total_echange]
      properties:
        citoyen_id: { type: string, format: uuid, example: a0000000-0000-4000-8000-000000000001 }
        solde: { type: integer, description: total_gagne − total_echange (transactions créditées uniquement), example: 105 }
        points_en_attente: { type: integer, example: 0 }
        total_gagne: { type: integer, example: 105 }
        total_echange: { type: integer, example: 0 }
    Recompense:
      type: object
      required: [id, nom, description, cout_points, partenaire, actif]
      properties:
        id: { type: string, format: uuid, readOnly: true, example: 7ec00000-0000-4000-8000-000000000001 }
        nom: { type: string, example: Forfait internet 1 Go }
        description: { type: string, example: Valable 7 jours }
        cout_points: { type: integer, minimum: 1, example: 100 }
        partenaire: { type: string, example: Opérateur partenaire (fictif) }
        actif: { type: boolean, example: true }
    RecompenseEcriture:
      type: object
      properties:
        nom: { type: string }
        description: { type: string }
        cout_points: { type: integer, minimum: 1 }
        partenaire: { type: string }
        actif: { type: boolean }
    Echange:
      type: object
      required: [id, citoyen_id, recompense_id, nom_recompense, cout_points, date]
      properties:
        id: { type: string, format: uuid, readOnly: true, example: ec000000-0000-4000-8000-000000000001 }
        citoyen_id: { type: string, format: uuid, example: a0000000-0000-4000-8000-000000000001 }
        recompense_id: { type: string, format: uuid, example: 7ec00000-0000-4000-8000-000000000001 }
        nom_recompense: { type: string, example: Forfait internet 1 Go }
        cout_points: { type: integer, description: Coût figé au moment de l'échange, example: 100 }
        date: { $ref: '#/components/schemas/DateHeure' }

    # ------------------------------------------------------------------ ÉNERGIE
    MesureSite:
      type: object
      required: [date, biogaz_mesure_m3, ch4_pct, source]
      properties:
        date: { type: string, format: date, example: '2026-09-12' }
        biogaz_mesure_m3: { type: number, minimum: 0, example: 22.4 }
        ch4_pct: { type: number, minimum: 0, maximum: 100, example: 61 }
        temperature_c: { type: number, nullable: true, example: 36.2 }
        ph: { type: number, nullable: true, example: 7.1 }
        source: { $ref: '#/components/schemas/SourceMesure' }
    ProductionEnergie:
      type: object
      required: [id, site_id, code_site, date, statut_journee, poids_organique_recu_kg, biogaz_attendu_m3, biogaz_mesure_m3,
        ch4_pct, temperature_c, ph, ecart_pct, biogaz_cuisson_m3, biogaz_perte_m3, biogaz_valorise_m3, electricite_kwh,
        chaleur_kwh, digestat_kg, destination_digestat, foyers_equivalents, foyers_cuisson, statuts_donnees]
      description: |
        Une ligne par site et par jour. Les champs calculés à partir du biogaz mesuré restent null tant
        qu'aucune mesure n'a été reçue. Formules : CDC v2 §4.
      properties:
        id: { type: string, format: uuid, readOnly: true, example: 9d000000-0000-4000-8000-000000000002 }
        site_id: { type: string, format: uuid, example: d1900000-0000-4000-8000-000000000002 }
        code_site: { type: string, example: DIG-02 }
        date: { type: string, format: date, example: '2026-09-12' }
        statut_journee: { $ref: '#/components/schemas/StatutJournee' }
        poids_organique_recu_kg: { type: number, example: 320 }
        biogaz_attendu_m3: { type: number, example: 32 }
        biogaz_mesure_m3: { type: number, nullable: true, example: 22.4 }
        ch4_pct: { type: number, nullable: true, example: 61 }
        temperature_c: { type: number, nullable: true, example: 36.2 }
        ph: { type: number, nullable: true, example: 7.1 }
        ecart_pct: { type: number, nullable: true, description: 'Arrondi à 0,1', example: -30 }
        biogaz_cuisson_m3: { type: number, nullable: true, example: 0 }
        biogaz_perte_m3: { type: number, nullable: true, example: 0 }
        biogaz_valorise_m3: { type: number, nullable: true, example: 22.4 }
        electricite_kwh: { type: number, nullable: true, example: 38.08 }
        chaleur_kwh: { type: number, nullable: true, example: 76.16 }
        digestat_kg: { type: number, example: 160 }
        destination_digestat: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/DestinationDigestat' }] }
        foyers_equivalents: { type: number, nullable: true, example: 7.8 }
        foyers_cuisson: { type: number, nullable: true, description: V2 — 0 tant que part_cuisson_pct = 0, example: 0 }
        statuts_donnees:
          type: object
          description: Badge de chaque champ chiffré (nom du champ → statut)
          additionalProperties: { $ref: '#/components/schemas/StatutDonnee' }
          example:
            poids_organique_recu_kg: mesure
            biogaz_attendu_m3: estime
            biogaz_mesure_m3: simule
            ch4_pct: simule
            electricite_kwh: estime
            chaleur_kwh: estime
            digestat_kg: estime
            foyers_equivalents: estime
    ProductionGlobale:
      type: object
      required: [date, nb_sites, poids_organique_recu_kg, biogaz_attendu_m3, biogaz_mesure_m3, electricite_kwh, chaleur_kwh,
        digestat_kg, foyers_equivalents, alertes_ouvertes, par_site]
      properties:
        date: { type: string, format: date, example: '2026-09-12' }
        nb_sites: { type: integer, example: 3 }
        poids_organique_recu_kg: { type: number, example: 960 }
        biogaz_attendu_m3: { type: number, example: 96 }
        biogaz_mesure_m3: { type: number, example: 85.4 }
        electricite_kwh: { type: number, example: 145.18 }
        chaleur_kwh: { type: number, example: 290.36 }
        digestat_kg: { type: number, example: 480 }
        foyers_equivalents: { type: number, example: 29.7 }
        alertes_ouvertes: { type: integer, example: 1 }
        par_site: { type: array, items: { $ref: '#/components/schemas/ProductionEnergie' } }

    # ------------------------------------------------------------------ ALERTES
    Alerte:
      type: object
      required: [id, site_id, code_site, type, statut, valeur_attendue, valeur_mesuree, ecart_pct, description, nb_occurrences,
        date_creation, date_derniere_occurrence, date_resolution, commentaire_resolution, resolue_par_id]
      properties:
        id: { type: string, format: uuid, readOnly: true, example: a1e00000-0000-4000-8000-000000000001 }
        site_id: { type: string, format: uuid, example: d1900000-0000-4000-8000-000000000002 }
        code_site: { type: string, example: DIG-02 }
        type: { $ref: '#/components/schemas/TypeAlerte' }
        statut: { $ref: '#/components/schemas/StatutAlerte' }
        valeur_attendue: { type: number, description: 'm³ de biogaz (production) ou ch4_min_pct (composition)', example: 32 }
        valeur_mesuree: { type: number, example: 22.4 }
        ecart_pct: { type: number, example: -30 }
        description: { type: string, example: Production de biogaz inférieure de 30 % à l'attendu }
        nb_occurrences: { type: integer, description: Jours consécutifs regroupés sous cette alerte, example: 1 }
        date_creation: { $ref: '#/components/schemas/DateHeure' }
        date_derniere_occurrence: { $ref: '#/components/schemas/DateHeure' }
        date_resolution: { type: string, format: date-time, nullable: true }
        commentaire_resolution: { type: string, nullable: true, example: null }
        resolue_par_id: { type: string, format: uuid, nullable: true, example: null }

    # --------------------------------------------------------------- SUPERVISION
    ElementVerification:
      type: object
      required: [type, objet_type, objet_id, libelle, details, date]
      properties:
        type: { $ref: '#/components/schemas/TypeVerification' }
        objet_type: { $ref: '#/components/schemas/TypeObjet' }
        objet_id: { type: string, format: uuid, example: c0110000-0000-4000-8000-000000000003 }
        libelle: { type: string, example: 'BAC-022 : 2 kg pour 40 scans (0,05 kg/scan)' }
        details: { type: object, additionalProperties: true, example: { kg_par_scan: 0.05, seuil: 0.3 } }
        date: { $ref: '#/components/schemas/DateHeure' }
    TracabiliteBac:
      type: object
      required: [bac, citoyens, historique]
      properties:
        bac: { $ref: '#/components/schemas/Bac' }
        citoyens:
          type: array
          items:
            type: object
            required: [id, nom, statut_validation]
            properties:
              id: { type: string, format: uuid }
              nom: { type: string }
              statut_validation: { $ref: '#/components/schemas/StatutValidation' }
        historique:
          type: array
          description: Une entrée par collecte, de la plus récente à la plus ancienne
          items: { $ref: '#/components/schemas/EtapeTracabilite' }
    EtapeTracabilite:
      type: object
      required: [collecte, tournee, lots, valeur_kg, coef_qualite, points_bac, transactions, production]
      properties:
        collecte: { $ref: '#/components/schemas/Collecte' }
        tournee: { $ref: '#/components/schemas/Tournee' }
        lots: { type: array, items: { $ref: '#/components/schemas/LotTrie' } }
        valeur_kg: { type: number, nullable: true, example: 8.54 }
        coef_qualite: { type: number, nullable: true, example: 1.0 }
        points_bac: { type: number, nullable: true, description: Avant arrondi par citoyen, example: 290.36 }
        transactions: { type: array, items: { $ref: '#/components/schemas/GreenPointsTransaction' } }
        production:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ProductionEnergie' }]
    Parametre:
      type: object
      required: [cle, valeur, unite, statut, description, source, date_modification]
      properties:
        cle: { $ref: '#/components/schemas/CleParametre' }
        valeur: { type: number, example: 0.1 }
        unite: { type: string, example: m³/kg }
        statut: { $ref: '#/components/schemas/StatutParametre' }
        description: { type: string, example: Biogaz produit par kg de matière organique }
        source: { type: string, nullable: true, example: Dossier de concours v4 — source à citer }
        date_modification: { $ref: '#/components/schemas/DateHeure' }
    EntreeJournal:
      type: object
      required: [id, date, auteur_id, nom_auteur, action, objet_type, objet_id, ancienne_valeur, nouvelle_valeur, motif]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        date: { $ref: '#/components/schemas/DateHeure' }
        auteur_id: { type: string, format: uuid }
        nom_auteur: { type: string, example: Admin Démo }
        action: { type: string, example: parametre.modifier }
        objet_type: { $ref: '#/components/schemas/TypeObjet' }
        objet_id: { type: string, example: coefficient_biogaz_m3_par_kg }
        ancienne_valeur: { type: string, nullable: true, description: Valeur sérialisée en JSON, example: '0.1' }
        nouvelle_valeur: { type: string, nullable: true, description: Valeur sérialisée en JSON, example: '0.12' }
        motif: { type: string, nullable: true }
    ScenarioSimulation:
      type: object
      required: [site_id, facteur_mesure]
      properties:
        site_id: { type: string, format: uuid, example: d1900000-0000-4000-8000-000000000002 }
        facteur_mesure: { type: number, minimum: 0, maximum: 2, description: biogaz_mesure = biogaz_attendu × facteur, example: 0.7 }
