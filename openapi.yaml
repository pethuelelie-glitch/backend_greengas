        - { name: statut, in: query, schema: { $ref: '#/components/schemas/StatutAlerte' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/TypeAlerte' } }
      responses:
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '200':
          description: Page d'alertes, de la plus récente à la plus ancienne
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/Alerte' } }
  /alertes/{id}/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: alertes_detail
      tags: [Alertes]
      summary: Détail d'une alerte (administrateur ou responsable méthanisation)
      responses:
        '200':
          description: Alerte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alerte' }
        '404': { $ref: '#/components/responses/Introuvable' }
  /alertes/{id}/resoudre/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: alertes_resoudre
      tags: [Alertes]
      summary: Marquer une alerte comme résolue (responsable méthanisation) — journalisé
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commentaire]
              properties:
                commentaire: { type: string, example: Température du digesteur rétablie à 37 °C }
      responses:
        '200':
          description: Alerte résolue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alerte' }
